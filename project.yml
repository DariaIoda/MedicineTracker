name: MedicineTracker
options:
  bundleIdPrefix: com.example
targets:
  MedicineTracker:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources: [MedicineTracker]
    resources:
      - path: MedicineTracker/Resources
  MedicineTrackerTests:
    type: bundle.unit-test
    platform: iOS
    sources: [MedicineTrackerTests]
    dependencies:
      - target: MedicineTracker
  MedicineTrackerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [MedicineTrackerUITests]
    dependencies:
      - target: MedicineTracker