name: InventoryQR
options:
  bundleIdPrefix: by.gstu.itp
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: ru
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGNING_ALLOWED: "NO"
targets:
  InventoryQR:
    type: application
    platform: iOS
    sources:
      - path: InventoryQR
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: by.gstu.itp.InventoryQR
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Инвентарь"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSCameraUsageDescription: "Камера нужна для сканирования QR-кодов на коробках"
        TARGETED_DEVICE_FAMILY: "1,2"
  InventoryQRTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: InventoryQRTests
    dependencies:
      - target: InventoryQR
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  InventoryQRUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: InventoryQRUITests
    dependencies:
      - target: InventoryQR
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: InventoryQR
schemes:
  InventoryQR:
    build:
      targets:
        InventoryQR: all
        InventoryQRTests: [test]
        InventoryQRUITests: [test]
    test:
      targets:
        - InventoryQRTests
        - InventoryQRUITests
