name: MedicineTracker

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: 5.0
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO

targets:
  MedicineTracker:
    type: application
    platform: iOS
    sources:
      - path: MedicineTracker
        excludes:
          - "Resources/**"
    resources:
      - path: MedicineTracker/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.MedicineTracker
        GENERATE_INFOPLIST_FILE: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0

  MedicineTrackerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MedicineTrackerTests
    dependencies:
      - target: MedicineTracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.MedicineTrackerTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/MedicineTracker.app/MedicineTracker"
        BUNDLE_LOADER: "$(TEST_HOST)"

  MedicineTrackerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: MedicineTrackerUITests
    dependencies:
      - target: MedicineTracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.MedicineTrackerUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: MedicineTracker

schemes:
  MedicineTracker:
    build:
      targets:
        MedicineTracker: all
        MedicineTrackerTests: [test]
        MedicineTrackerUITests: [test]
    test:
      gatherCoverageData: true
      targets:
        - name: MedicineTrackerTests
        - name: MedicineTrackerUITests
