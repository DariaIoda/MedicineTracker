name: MedicineTracker
options:
  bundleIdPrefix: com.example
targets:
  MedicineTracker:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources: [MedicineTracker]
    resources:
      - path: MedicineTracker/Resources
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0

  MedicineTrackerTests:
    type: bundle.unit-test
    platform: iOS
    sources: [MedicineTrackerTests]
    dependencies:
      - target: MedicineTracker

  MedicineTrackerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [MedicineTrackerUITests]
    dependencies:
      - target: MedicineTracker