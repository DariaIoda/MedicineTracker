name: iOS build & tests

on:
  push:
    branches: [ main ]
    tags: [ 'lab*' ]
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Tools
        run: |
          xcodebuild -version
          xcrun simctl list devices available | grep -E "iPhone|iPad" | head -20

      - name: Generate project
        run: bash scripts/ci_test.sh prepare

      - name: Build for testing
        timeout-minutes: 25
        run: bash scripts/ci_test.sh build

      - name: Package simulator app
        timeout-minutes: 20
        run: |
          xcodebuild build -project InventoryQR.xcodeproj -scheme InventoryQR -configuration Release \
            -sdk iphonesimulator -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build/AppBuild ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO > build/app.log 2>&1 || { tail -40 build/app.log; exit 1; }
          cd build/AppBuild/Build/Products/Release-iphonesimulator
          lipo -info InventoryQR.app/InventoryQR
          ditto -c -k --sequesterRsrc --keepParent InventoryQR.app "$GITHUB_WORKSPACE/InventoryQR-simulator.zip"

      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: InventoryQR-simulator-app
          path: InventoryQR-simulator.zip

      - name: Unit tests
        timeout-minutes: 15
        run: bash scripts/ci_test.sh unit

      - name: UI tests on iPhone
        if: always()
        timeout-minutes: 20
        run: bash scripts/ci_test.sh ui iphone

      - name: UI tests on iPad
        if: always()
        timeout-minutes: 20
        run: bash scripts/ci_test.sh ui ipad

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: build/*.log
